<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>- gen -</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@300;400;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg"></div>

  <!-- Fixed top name area -->
  <div class="top-header">
    <h1 class="name" aria-label="- gen -">
      <span class="sr-only">- gen -</span>
      <svg viewBox="0 0 1000 160" preserveAspectRatio="xMidYMid meet" role="img" aria-hidden="false">
        <!-- Stroke text (underneath) -->
        <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="svg-name-stroke">- gen -</text>
        <!-- Fill text (on top) -->
        <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="svg-name-fill">- gen -</text>
      </svg>
    </h1>
    <div class="top-note">that's me</div>
  </div>

  <main class="card" id="card">
    <section class="about">
      <h2 class="section-title" aria-label="ABOUT ME">
        <span class="sr-only">ABOUT ME</span>
        <svg viewBox="0 0 1000 120" preserveAspectRatio="xMidYMid meet" role="img" aria-hidden="false">
          <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" class="svg-section-stroke">ABOUT ME</text>
          <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" class="svg-section-fill">ABOUT ME</text>
        </svg>
      </h2>
      <div class="pronouns" id="pronouns">(she/her)</div>
      <p class="bio" id="bio">text text here text</p>
      <div class="timezone" id="timezone">Europe, GMT+2</div>
    </section>

    <!-- About section only; socials moved to footer/screen bottom -->
  </main>

  <!-- Socials fixed near the bottom of the viewport -->
  <div class="socials-footer" aria-hidden="false">
    <div class="icons" id="icons"></div>
    <div class="label">
      <span class="sr-only">socials</span>
      <svg viewBox="0 0 800 120" preserveAspectRatio="xMidYMid meet" role="img" aria-hidden="false">
        <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="svg-label-stroke">socials</text>
        <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="svg-label-fill">socials</text>
      </svg>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
